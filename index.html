  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refweir — the Git forge built for agents, kept by humans</title>
    <meta name="description" content="Self-hosted, vendor-neutral Git forge for AI coding agents. One Go binary, native MCP, and capability leases that expire in an hour." />
    <link rel="canonical" href="https://refweir.dev/" />
    <meta property="og:title" content="Refweir — the Git forge built for agents, kept by humans" />
    <meta property="og:description" content="Self-hosted, vendor-neutral Git forge for AI coding agents. One Go binary, native MCP, and capability leases that expire in an hour." />
    <meta property="og:image" content="https://refweir.dev/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Refweir — the Git forge built for agents, kept by humans" />

    <meta name="twitter:image" content="https://refweir.dev/og-image.png" />
    <meta name="theme-color" content="#ecebe5" />
    <script>
      try {
        var stored = localStorage.getItem('refweir-theme') || localStorage.getItem('refweir_theme')
        var theme = stored === 'dark' || stored === 'light' ? stored : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        var palette = { light: '#ecebe5', dark: '#131311' }
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', palette[theme])
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@80..100,400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
